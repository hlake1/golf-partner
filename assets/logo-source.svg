<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scramble app icon — middle variant from branding board.
  Mist blue background, dark navy mark. 1024x1024.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rounded square background (mist blue / steel) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#8FA0B5"/>

  <!-- S-fairway path in navy -->
  <path
    d="M 720 300
       C 720 220, 620 180, 500 200
       C 380 220, 300 300, 300 380
       C 300 460, 380 500, 500 520
       C 620 540, 720 580, 720 660
       C 720 740, 620 780, 500 780"
    fill="none"
    stroke="#0F1622"
    stroke-width="76"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Flagstick -->
  <line x1="720" y1="120" x2="720" y2="300" stroke="#0F1622" stroke-width="14" stroke-linecap="round"/>

  <!-- Flag triangle -->
  <path d="M 720 130 L 830 165 L 720 200 Z" fill="#0F1622"/>

  <!-- Hole cup (bottom) -->
  <circle cx="500" cy="780" r="20" fill="#0F1622"/>
</svg>
